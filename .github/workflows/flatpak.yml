name: Flatpak

# Builds both flatpak manifests
# (build-aux/flatpak/online.fujinet.go.intv.{gnome,kde}.yml) with
# flatpak-builder against the real GNOME/KDE runtimes pulled from Flathub,
# rather than flathub-infra's prebuilt build container images -- those only
# publish a handful of recent runtime versions each and this avoids being
# blocked on that lag. Slower (pulling ~1-2 GB of runtime + SDK per
# frontend, no cross-run cache), but it is exactly the recipe verified
# locally before this workflow was written (both manifests were actually
# built AND run, not just eyeballed -- see TODO), so a green run here means
# what it says.
#
# WITH_INTV_ROMS=OFF is baked into both manifests already (not a workflow
# concern): the Mattel EXEC/GROM are not freely redistributable (see
# COMPLIANCE.md), so every artifact this repository publishes -- these
# flatpaks included -- embeds neither and leaves it to FujiNet >
# Configuration's own ROM import.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - build-aux/flatpak/online.fujinet.go.intv.gnome.yml
          - build-aux/flatpak/online.fujinet.go.intv.kde.yml
    # Self-hosted, in a container. --privileged: flatpak-builder's bubblewrap
    # sandbox needs user namespaces, which the default container profile blocks.
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --privileged --add-host=host.docker.internal:host-gateway
    steps:
      - name: Install flatpak and flatpak-builder
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl flatpak flatpak-builder elfutils unzip
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/checkout@v4

      - name: Install the runtime and SDK this manifest targets
        run: |
          runtime=$(sed -n 's/^runtime: *//p' "${{ matrix.manifest }}")
          runtime_version=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "${{ matrix.manifest }}")
          sdk=$(sed -n 's/^sdk: *//p' "${{ matrix.manifest }}")
          flatpak install -y --user flathub \
            "${runtime}/x86_64/${runtime_version}" \
            "${sdk}/x86_64/${runtime_version}"

      # No --install: building is the check. (Installing would also work,
      # but there is nothing here to run it against on a headless runner.)
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            build-flatpak "${{ matrix.manifest }}"
