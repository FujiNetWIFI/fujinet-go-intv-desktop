name: macOS

# Builds the native AppKit frontend (frontends/macos) alongside core + the
# FujiNet runtime + the test suite. UNTESTED recipe: the macOS frontend
# itself was written on Linux and has never been built anywhere (see TODO)
# -- this workflow is the first thing that will actually attempt it. If it
# fails, that is real, useful signal the frontend genuinely needs; do not
# assume the workflow itself is wrong before checking the frontend code.
#
# This is push/PR CI, not the release build: it links a shared SDL3 for
# speed, unlike release.yml's macos-package job, which builds SDL3
# statically, verifies the bundle has no Homebrew library leaks, and
# produces the actual shipped .zip.
#
# WITH_INTV_ROMS=OFF for the same reason as linux.yml: the Mattel EXEC/GROM
# are not freely redistributable (see COMPLIANCE.md), so CI never has them,
# and boot_smoke/pad_test/audio/fujibus_smoke/debug/stic report ctest's
# skip code (77) rather than actually running.
#
# WITH_FUJINET is left at its default (ON): tools/fujinet/build-fujinet-
# desktop.sh already has Darwin-specific handling (libfujinet.dylib, and it
# always builds mbedTLS 3.6.5 from source on Darwin rather than trusting a
# system copy), so this is meant to work here, not just on Linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    # SDL3 installs to a non-standard prefix (see below), so every step that
    # runs a linked binary -- configure-time checks as well as ctest -- needs
    # the loader to find it there.
    env:
      DYLD_LIBRARY_PATH: /tmp/sdl3-install/lib
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja python3

      # SDL3 is too new to assume a Homebrew formula matches the exact
      # version this project is developed and tested against; built from
      # source and pinned, the same "pin what matters" policy as jzIntv
      # (SHA256 archive) and the FujiNet firmware (pinned commit) elsewhere
      # in this build -- and the same recipe linux.yml uses.
      - name: Build and install SDL3 (release-3.4.12, pinned)
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-install \
            -DWITH_INTV_ROMS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
