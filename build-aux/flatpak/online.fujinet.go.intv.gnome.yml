# Flatpak manifest for the GNOME frontend.
#
# Self-contained: every input is declared here, so this builds from a plain
# checkout with no preparation steps -- which is also what makes it work
# unchanged in GNOME Builder (Builder finds this manifest, and its Run button
# then builds and launches the app).
#
# The app source is the local tree minus the directories the manifest
# provides itself: third_party/ comes from the pinned sources below (the
# same jzIntv archive and fujinet-firmware commit as cmake/Dependencies.cmake),
# so a flatpak build never depends on the state of a working checkout or on
# network access during the actual build step (only during source fetch).
#
# Build + install + run:
#   flatpak-builder --user --install --force-clean build-flatpak \
#       build-aux/flatpak/online.fujinet.go.intv.gnome.yml
#   flatpak run online.fujinet.go.intv.gnome
#
# NOTE: bump runtime-version (and the SDL tag) as new GNOME runtimes ship;
# `flatpak remote-ls flathub --runtime | grep org.gnome.Platform` lists what
# is available. Old runtimes go end-of-life quickly.

app-id: online.fujinet.go.intv.gnome
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: fujinet-go-intv-gnome

finish-args:
  - --share=ipc
  - --share=network          # the FujiNet BoIP peripheral + the loopback web UI
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio      # SDL audio (PipeWire's Pulse interface)
  - --device=all             # gamepad hotplug (hidraw/evdev)

modules:
  - name: sdl3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        # Pin the release you validated against; keep it in step with the
        # SDL the CI jobs build (.github/workflows/linux.yml, macos.yml).
        tag: release-3.4.12
        commit: f87239e71e42da91ca317a12eefb82cfbf3393eb

  # FujiNet links mbedTLS statically and needs 3.x (4.x drops the legacy
  # mbedtls/md5.h it includes); the runtime ships none. Threading is switched
  # on because fujinet drives TLS from several threads.
  - name: mbedtls
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_PROGRAMS=OFF
      - -DENABLE_TESTING=OFF
      - -DMBEDTLS_FATAL_WARNINGS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DUSE_STATIC_MBEDTLS_LIBRARY=ON
      - -DUSE_SHARED_MBEDTLS_LIBRARY=OFF
      - -DLINK_WITH_PTHREAD=ON
      # Left to GNUInstallDirs this lands in lib64 on some builders and lib
      # on others; the FujiNet build has to find it either way, but pinning
      # it keeps the two ends predictable.
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/Mbed-TLS/mbedtls.git
        tag: mbedtls-3.6.5
        commit: e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df
      - type: shell
        commands:
          - sed -i -e 's|^//#define MBEDTLS_THREADING_C|#define MBEDTLS_THREADING_C|'
            -e 's|^//#define MBEDTLS_THREADING_PTHREAD|#define MBEDTLS_THREADING_PTHREAD|'
            include/mbedtls/mbedtls_config.h

  # The FujiNet build renders its web UI from jinja2 templates driven by a
  # yaml description. Build-time only: /app/lib/python3.12/site-packages is on
  # the SDK python's path, and the module cleans up after itself.
  - name: python3-webui-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST}
        --find-links="file://${PWD}" PyYAML Jinja2 MarkupSafe
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
      - type: file
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d
      - type: file
        url: https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz
        sha256: 722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698

  - name: fujinet-go-intv
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DFRONTEND=gnome
      - -DWITH_WEBVIEW=ON     # webkitgtk-6.0 ships in the GNOME runtime
      # The Mattel EXEC/GROM are copyrighted firmware with no freely
      # redistributable substitute (unlike CoCo's HDB-DOS pair) -- see
      # COMPLIANCE.md. Every artifact this repository publishes, this
      # flatpak included, embeds neither and leaves it to
      # FujiNet > Configuration's own ROM import.
      - -DWITH_INTV_ROMS=OFF
    build-options:
      env:
        # Where the FujiNet build finds the static mbedTLS built above.
        MBEDTLS_ROOT_DIR: /app
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - build
          - build-flatpak
          - build-flatpak-kde
          - third_party
          - tools/fujinet/work
      # Pinned exactly as cmake/Dependencies.cmake: same archive, same
      # SHA256. intv_provide_dependency() skips its own download once it
      # finds src/jzintv.c (the SENTINEL) already here.
      - type: archive
        url: http://spatula-city.org/~im14u2c/intv/dl/jzintv-20200712-src.zip
        sha256: b36b3b274d0fc05cb227818d4957f96620d23d8d6b7596c24f07675ced7129f3
        strip-components: 1
        dest: third_party/jzintv
      - type: git
        url: https://github.com/FujiNetWIFI/fujinet-firmware
        commit: 13465cdd044304ff96ad41a5f029087b28bed17f
        dest: third_party/fujinet-firmware
